
#################################################################################
# The project's only compose file, so there is only ever one database.          #
#                                                                               #
#   make up    postgres + web + nginx -> the whole app on http://localhost:8090 #
#   make run   postgres + web         -> the API alone on http://localhost:8000 #
#                                                                               #
# Both select services from this file, so either way it is the same postgres    #
# and the same data.                                                            #
#################################################################################

name: Pass On

services:
  web:
    build: ./src/backend
    container_name: passon_web
    # The image's entrypoint migrates, then serves.
    # Sessions (used by the login flow) live in the database, so those tables
    # have to exist before the first request.
    # Bound to 127.0.0.1 for `make run`, which serves the API without nginx.
    # With the full stack the browser still goes through http://localhost:8090,
    # where the app and the API share one origin; :8000 is for curl and tests.
    #ports:
    #  - "127.0.0.1:8000:8000"
    volumes:
      - ./src/backend:/app
    # Only the database credentials are set here. Everything else
    # (DOCS_URL, DINUM_USE_MOCK, GROQ_API_KEY...) stays in src/backend/.env,
    # which settings.py loads through the mount above -- compose-level
    # variables would silently win over that file. The .env file is located in src/backend/.env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_HOST: postgres
      # Regenerates missing migrations on boot (dev convenience, from the
      # backend-only stack this file absorbed). It has teeth now that `passon`
      # is an installed app: a model edited without `makemigrations` is picked
      # up here. Set it to 0 to be told about the drift instead.
      DJANGO_AUTO_MIGRATE: ${DJANGO_AUTO_MIGRATE:-1}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # The one database: users, their relations, and the sessions the login flow
  # depends on. Stored in a named volume, so `make down` keeps the data and
  # `docker compose down -v` is what wipes it.
  postgres:
    image: postgres:16-alpine
    container_name: passon_postgres
    restart: unless-stopped
    # Needed on this container's own environment, not just `web`'s: the
    # postgres image's entrypoint uses these to initialize the database on a
    # fresh volume, and the healthcheck below reads them too. A pre-existing
    # data volume masks a missing POSTGRES_PASSWORD (init only runs once, on
    # an empty volume), which is how this went unnoticed until a fresh one.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-db}
    # Published to localhost only, for a `manage.py runserver` run directly on
    # the host (no Docker for that process) with POSTGRES_HOST=localhost in
    # src/backend/.env. The Dockerized `web` service never uses this -- it
    # still reaches this container over the compose network as "postgres".
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - passon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Next.js app (src/passon-frontend) container: the dashboard, the login page, the
  # team listing and the handover page.
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: passon_frontend
    restart: unless-stopped
    environment:
      # "true" makes the passation card run entirely off a hardcoded fixture --
      # no fetch, no PATCH, no dependency on Django or Groq being reachable.
      # Login is untouched, only the generated card is swapped. `next dev`
      # (this service's CMD) reads it at startup, so a container restart picks
      # up a change -- no image rebuild needed. Set it in src/backend/.env,
      # which `make up` already passes as this stack's --env-file.
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    depends_on:
      - web

  # The single entry point for Pass'on: serves the static homepage from disk
  # and proxies everything else -- /api/ and /admin/ to Django, /dashboard,
  # /login, /equipe, /gerer-ma-passation, /logo/ and /_next/ to the Next app.
  # Same origin for all of them, so the frontend calls /api/... with no CORS
  # setup and no second port.
  nginx:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    container_name: passon_nginx
    restart: unless-stopped
    ports:
      # Public port of the app
      - "8090:8090"
    depends_on:
      - web

volumes:
  passon-db:
