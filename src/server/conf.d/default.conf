# Single entry point for Pass'on, on one port: the landing page is served from
# disk, the application is proxied to its own container, and everything Django
# owns (/api/) goes to `web`. One origin for all three, so the frontend calls
# /api/... as a relative URL -- no CORS, and the session cookie and Django's
# CSRF check both work.
#
# There were two server blocks for a while, :8090 for the old React app and
# :8091 for the new frontend being built beside it. The old app now lives in
# .save/frontend/ and only this block remains.
server {
    listen 8090;
    server_name localhost;
    charset utf-8;

    server_tokens off;

    root /usr/share/nginx/homepage;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag noindex always;

    # The Next.js app (src/frontend), in its own container -- hence the
    # service name rather than a host address: Compose puts both on the same
    # network. It used to run on the host, reached through
    # host.docker.internal, and had to be started by hand.
    #
    # No trailing slash on proxy_pass, so the path is passed through as it is:
    # the app serves /dashboard at /dashboard. It used to be stripped, which
    # made the app's own "/" the dashboard while "/" here is the homepage --
    # two meanings for one URL, and a <Link href="/"> in the interface landed
    # on the landing page instead of the dashboard.
    location /dashboard {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next's dev server pushes rebuilds over a websocket; without these
        # two headers the page loads but never hot-reloads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # Django, on the same origin as the homepage and the dashboard. The
    # session cookie and Django's CSRF check both depend on that: a call from
    # another origin would need CORS *and* an entry in CSRF_TRUSTED_ORIGINS,
    # and the cookie would still be dropped by a browser blocking third-party
    # cookies. $http_host keeps the port, which the CSRF check compares.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logging in walks Drive's whole OIDC redirect chain, and generating a
        # handover waits on an LLM; neither fits in the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }

    # The login page is a route of the Next app, like the dashboard, but its
    # path is the same on both sides so nothing is stripped here.
    location /login {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Next serves its assets and its other routes from the root, not from
    # /dashboard, so those prefixes are proxied as they are. Anything not
    # listed here is served from disk, which is only ever this page.
    location /_next/ {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location /gerer-ma-passation {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /equipe {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /logo/ {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
