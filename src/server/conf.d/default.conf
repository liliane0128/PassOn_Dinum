# Single entry point for Pass'on: the built React app is served from disk,
# everything Django owns (/api/, /admin/) is proxied to the `web` container.
# Same origin for both, so the frontend calls /api/... with no CORS setup and
# no second port.

server {
    listen 8090;
    server_name localhost;
    charset utf-8;

    server_tokens off;

    root /usr/share/nginx/homepage;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag noindex always;

    # No trailing slash on proxy_pass, so the path is passed through as it is:
    # the app serves /dashboard at /dashboard. It used to be stripped, which
    # made the app's own "/" the dashboard while "/" here is the homepage --
    # two meanings for one URL, and a <Link href="/"> in the interface landed
    # on the landing page instead of the dashboard.
    location /dashboard {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next's dev server pushes rebuilds over a websocket; without these
        # two headers the page loads but never hot-reloads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # Django, on the same origin as the homepage and the dashboard. The
    # session cookie and Django's CSRF check both depend on that: a call from
    # another origin would need CORS *and* an entry in CSRF_TRUSTED_ORIGINS,
    # and the cookie would still be dropped by a browser blocking third-party
    # cookies. $http_host keeps the port, which the CSRF check compares.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logging in walks Drive's whole OIDC redirect chain, and generating a
        # handover waits on an LLM; neither fits in the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }

    # The login page is a route of the Next app, like the dashboard, but its
    # path is the same on both sides so nothing is stripped here.
    location /login {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Next's own assets and runtime, all under /_next/: the JS chunks, the
    # CSS, the fonts and images, and -- in dev -- the websocket that pushes
    # rebuilds to the browser. Next references them by absolute path from the
    # root, not from /dashboard, so the prefix is proxied as it is and the
    # path reaches the app unchanged (no trailing slash on proxy_pass).
    location /_next/ {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # The handover page: everything about a given "passation" (the handover
    # between two people) -- its files, its status, who owns what. It is a
    # route of the Next app (src/passon-frontend), not a file on disk, so the
    # request is forwarded to the Next server.
    #
    # No trailing slash on proxy_pass, so the path is passed through as it is:
    # the app serves /gerer-ma-passation at /gerer-ma-passation. A trailing
    # slash would rewrite the upstream path to "/" and send the visitor to the
    # dashboard instead.
    #
    # This route does real work -- it walks the API for the handover's data
    # and may wait on the backend -- so proxy_buffering is off: the page
    # starts rendering while the upstream is still producing it, rather than
    # nginx holding the whole response in memory first.
    location /gerer-ma-passation {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # The team page: the Next.js app (src/passon-frontend) lists every member
    # of the team here. It is a route of that app, not a file on disk, so the
    # request is forwarded to the Next server rather than served from the
    # homepage root.
    #
    # No trailing slash on proxy_pass, so the path is passed through as it is:
    # the app serves /equipe at /equipe. Adding a trailing slash would rewrite
    # the upstream path to "/" and land the visitor on the dashboard instead.
    location /equipe {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # The project's logo assets. They live in the Next app's public/ directory
    # (src/passon-frontend/public/logo/), so Next serves them, not nginx --
    # even though they are static files. Anything under /logo/ is forwarded
    # as it is.
    #
    # This is the one proxied location with no need for X-Forwarded-For or
    # buffering tweaks: a logo is a plain GET for a fixed file, with no
    # cookies, no auth and no streaming. $http_host alone is enough to keep
    # the origin consistent.
    location /logo/ {
        proxy_pass http://passon_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Catch-all: anything not claimed by a proxied location above is served
    # from disk (`root /usr/share/nginx/homepage`). On this block that is only
    # ever the static homepage.
    location / {
        try_files $uri $uri/ =404;
    }
}
