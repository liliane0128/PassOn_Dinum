# Single entry point for Pass'on: the built React app is served from disk,
# everything Django owns (/api/, /admin/) is proxied to the `web` container.
# Same origin for both, so the frontend calls /api/... with no CORS setup and
# no second port.

server {
    listen 8090;
    server_name localhost;
    charset utf-8;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag noindex always;

    # Handover dossiers and item lists can be large; uploads are not used yet.
    client_max_body_size 10m;

    # Django API (connectors: /api/<service>/items/, /api/extraction/items/,
    # /api/dossier/).
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        # $http_host keeps the port, unlike $host. Django compares the
        # browser's Origin header (http://localhost:8090) against its own host
        # when checking CSRF on a POST, and a host without the port fails that
        # check with "Origin checking failed" -- which curl never reveals,
        # since it sends no Origin header. ALLOWED_HOSTS is unaffected: Django
        # strips the port before validating the host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/dossier/ fetches every item from three upstream services and
        # then waits on an LLM call, so it needs much more than the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # The API answers per-request credentials; never let a proxy cache it.
        proxy_buffering off;
    }

    # Django admin, plus the static files it needs (Django's STATIC_URL is
    # /static/, which does not collide with Vite's /assets/).
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite writes content-hashed filenames under /assets/, so they can be
    # cached hard. `expires` is used rather than `add_header Cache-Control`
    # because a location-level add_header would drop the two security headers
    # inherited from the server block.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The entry point must never be cached, otherwise a rebuilt app keeps
    # loading the previous bundle's hashed filenames.
    location = /index.html {
        expires -1;
    }

    # React Router owns the routes (/, /manager, /moi): serve index.html for
    # anything that is not a real file, so a refresh or a pasted URL works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Homepage (:8091) -- the landing page of the new frontend, plus a way into
# its dashboard. Deliberately a second server block rather than a path on
# :8090: the migration to src/passon-frontend is happening step by step, and
# the old React app above must keep working untouched meanwhile.
# ---------------------------------------------------------------------------
server {
    listen 8091;
    server_name localhost;
    charset utf-8;

    server_tokens off;

    root /usr/share/nginx/homepage;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag noindex always;

    # The Next.js app (src/passon-frontend), run on the host with
    # `npm run dev -- -p 3001`. It is not containerised yet, so it is reached
    # through host.docker.internal, which docker-compose maps to the host
    # gateway for this container.
    #
    # No trailing slash on proxy_pass, so the path is passed through as it is:
    # the app serves /dashboard at /dashboard. It used to be stripped, which
    # made the app's own "/" the dashboard while "/" here is the homepage --
    # two meanings for one URL, and a <Link href="/"> in the interface landed
    # on the landing page instead of the dashboard.
    location /dashboard {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next's dev server pushes rebuilds over a websocket; without these
        # two headers the page loads but never hot-reloads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # Django, on the same origin as the homepage and the dashboard. The
    # session cookie and Django's CSRF check both depend on that: a call from
    # another origin would need CORS *and* an entry in CSRF_TRUSTED_ORIGINS,
    # and the cookie would still be dropped by a browser blocking third-party
    # cookies. $http_host keeps the port, which the CSRF check compares.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logging in walks Drive's whole OIDC redirect chain, and generating a
        # handover waits on an LLM; neither fits in the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }

    # The login page is a route of the Next app, like the dashboard, but its
    # path is the same on both sides so nothing is stripped here.
    location /login {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Next serves its assets and its other routes from the root, not from
    # /dashboard, so those prefixes are proxied as they are. Anything not
    # listed here is served from disk, which is only ever this page.
    location /_next/ {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location /gerer-ma-passation {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /equipe {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /logo/ {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
