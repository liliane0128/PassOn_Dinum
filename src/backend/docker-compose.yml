# Backend seul : Django sur http://localhost:8000, sans nginx ni frontend.
# Pour la pile complète (nginx + frontend compilé + Django sur :8090), voir le
# docker-compose.yml et le Makefile à la racine du dépôt.
services:
  web:
    build: .
    container_name: django_web
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      DJANGO_AUTO_MIGRATE: "1"
      DOCS_URL: ${DOCS_URL:-http://host.docker.internal:8071}
      DRIVE_URL: ${DRIVE_URL:-http://host.docker.internal:8071}
      MESSAGES_URL: ${MESSAGES_URL:-http://host.docker.internal:8901}
      MESSAGES_SESSION_COOKIE: ${MESSAGES_SESSION_COOKIE:-sessionid}
      DINUM_API_TIMEOUT: ${DINUM_API_TIMEOUT:-10}
      DINUM_USE_MOCK: ${DINUM_USE_MOCK:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        # Wait for the database to actually accept connections, not merely for
        # its container to exist -- the image's own healthcheck knows when.
        condition: service_healthy
    networks:
      - backend   # can talk to db
      - frontend  # can talk to other services / be exposed

  # Django utilise encore SQLite (settings.py) : ce service est en place pour
  # la migration vers postgres, il n'est pas encore branché. Ses identifiants
  # viennent du .env à la racine (voir template.env).
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ../../database:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true
  frontend:
